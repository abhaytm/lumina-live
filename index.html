
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Lumina Live | Premium Commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root { --brand-orange: #FF6B00; --brand-amber: #FF9E0B; }
      body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .shadow-glow { box-shadow: 0 10px 25px -5px rgba(255, 107, 0, 0.4); }
      @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }
    </style>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: { brand: { orange: '#FF6B00', amber: '#FF9E0B', light: '#FFF6F0', bg: '#FFF0E5' } },
            backgroundImage: { 'gradient-primary': 'linear-gradient(135deg, #FF6B00 0%, #FF9E0B 100%)' }
          }
        }
      }
    </script>

  }
}
